<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
</head>
<body>

    <h1>IPL Ticket Booking</h1>
<form>

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required minlength="3" maxlength="30">
<br><br>

<label for="email">Email:</label>
<input type="email" id="email" name="email" required>
<br><br>

<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone" required minlength="10" maxlength="10" pattern="[0-9]{10}" placeholder="Enter 10 digit number">
<br><br>

<label for="match">Select Match:</label>
<select id="match" name="match" required>
    <option value="">-- Select Match --</option>
    <option value="RCB vs CSK">RCB vs CSK - Bengaluru</option>
    <option value="MI vs KKR">MI vs KKR - Mumbai</option>
    <option value="CSK vs RR">CSK vs RR - Chennai</option>
    <option value="SRH vs RCB">SRH vs RCB - Hyderabad</option>
</select>
<br><br>

<label for="stand">Stand Category:</label>
<select id="stand" name="stand" required>
    <option value="">-- Select Stand --</option>
    <option value="General">General</option>
    <option value="Premium">Premium</option>
    <option value="VIP">VIP</option>
</select>
<br><br>

<label for="quantity">Number of Tickets:</label>
<input type="number" id="quantity" name="quantity" min="1" max="10" required>
<br><br>

<label>Additional Preferences:</label>
<br>

<input type="checkbox" id="food" name="preferences" value="Food">
<label for="food">Food Preference</label>

<input type="checkbox" id="parking" name="preferences" value="Parking">
<label for="parking">Parking Required</label>
<br><br>

<button type="submit">Submit Booking</button>
<button type="reset">Reset</button>
</form>
</body>
</html>
